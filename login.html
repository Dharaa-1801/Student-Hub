<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Hub Portal</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-900 font-sans min-h-screen flex flex-col justify-between">

    <!-- Simple Header (Without Navigation Menu) -->
   <header role="banner">
    <div class="header-container">
        <div class="brand">
            <h1>STUDENT HUB PORTAL</h1>
            <p>Academic Dashboard</p>
        </div>
    </div>  
    <nav aria-label="Main Navigation">
        <ul class="nav-list">
            <li><a href="index.html">Home</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="login.html" aria-current="page">Login</a></li>
            <li><a href="academics.html">Academics</a></li>
            <li><a href="notice.html">Notices</a></li>
            <li><a href="events.html">Events</a></li>
            <li><a href="studentsupport.html">Support</a></li>
            <li><a href="contact.html">Contact Us</a></li>
            <li><a href="feedback.html">Feedback</a></li>
            <li><a href="certificates.html">Certificates</a></li>
        </ul>
    </nav>
</header>

    <!-- Main Content Area (Perfect Centering) -->
    <main id="main-content" class="flex-1 flex items-center justify-center p-4">
        
        <!-- Login Card Center Container -->
        <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl shadow-lg p-6 sm:p-8">
            <div class="text-center mb-6">
                <h2 class="text-purple-950 text-2xl font-bold">Student Login</h2>
                <p class="text-slate-500 text-xs mt-1">Enter your credentials to access your portal</p>
            </div>

            <form action="profile.html" method="GET" class="space-y-4">
                <div class="form-group">
                    <label for="student-id" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Enrollment No / User ID</label>
                    <input type="text" id="student-id" name="enrollment" placeholder="e.g. 25CSXXX" required 
                        class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent transition">
                </div>
                
                <div class="form-group">
                    <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required 
                        class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent transition">
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-cyan-500 text-purple-950 font-bold py-2.5 px-4 rounded-lg text-sm hover:bg-cyan-600 active:scale-95 transition cursor-pointer shadow-sm">
                        Login to Portal
                    </button>
                </div>
            </form>
        </div>

    </main>

    <!-- Footer Section -->
    <footer class="bg-purple-950 text-white text-center p-4">
        <p class="text-xs">Student Hub Portal © 2026</p>
    </footer>

</body>
</html>
